name: Deploy to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by poll-venues.yml so refreshed session data reaches production.
  # Those commits carry [skip ci], which suppresses the push trigger above.
  workflow_call:
    secrets:
      FLY_API_TOKEN:
        required: true

# One deploy at a time. Newer commits supersede queued ones, but never
# interrupt a deploy already in flight.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
