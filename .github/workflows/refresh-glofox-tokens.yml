name: Refresh Glofox tokens

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC — tokens last ~30 days, so weekly is plenty
    - cron: '0 6 * * 1'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

concurrency:
  group: refresh-glofox-tokens
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Refresh Glofox guest tokens
        run: yarn refresh:glofox

      - name: Commit updated tokens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/config/api.ts
          if git diff --staged --quiet; then
            echo "No token changes to commit"
            exit 0
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "chore: refresh Glofox guest tokens ($TIMESTAMP) [skip ci]"
          # Rebase against any commits that landed during the run (e.g. a
          # concurrent venue poll) so the push doesn't lose to a race.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing and retrying"
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
