app = "slowfolk-benchmark-app"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs on a temporary Machine inside the private network before the new
  # version goes live, so it can reach Managed Postgres. Creates the auth
  # tables on an empty database and is a no-op afterwards.
  release_command = "node scripts/migrate-auth.mjs"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # The app sleeps when idle and wakes on the next request. Keeping one machine
  # running avoids a cold start on the first sign-in of the day.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
